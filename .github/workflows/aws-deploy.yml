name: CloudGuard AWS Deployment

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Get EC2 public IP
        id: ec2
        run: |
          IP=$(aws ec2 describe-instances \
            --filters \
              "Name=tag:Name,Values=cloudguard-preview" \
              "Name=instance-state-name,Values=running" \
            --query 'Reservations[0].Instances[0].PublicIpAddress' \
            --output text)

          echo "EC2_IP=$IP" >> "$GITHUB_OUTPUT"

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/cloudguard.pem
          chmod 600 ~/.ssh/cloudguard.pem
          ssh-keyscan -H "${{ steps.ec2.outputs.EC2_IP }}" >> ~/.ssh/known_hosts

      - name: Deploy application
        run: |
          ssh -i ~/.ssh/cloudguard.pem ubuntu@${{ steps.ec2.outputs.EC2_IP }} << 'EOF'
            set -e

            cd /opt/cloudguard

            git fetch origin
            git reset --hard origin/main

            sudo docker build -t cloudguard:latest .

            sudo docker rm -f cloudguard || true

            sudo docker run -d \
              --name cloudguard \
              --restart unless-stopped \
              -p 5000:5000 \
              cloudguard:latest

            sleep 10

            sudo docker ps
          EOF

      - name: Health check
        run: |
          curl --fail --retry 5 --retry-delay 5 \
            "http://${{ steps.ec2.outputs.EC2_IP }}:5000/health"
